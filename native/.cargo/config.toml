# macOS: give the library a relocatable install name instead of the build machine's path.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-install_name,@rpath/libsvgimporter_core.dylib"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-install_name,@rpath/libsvgimporter_core.dylib"]

# Android: 16 KB page alignment, required by Google Play for apps targeting Android 15 and later.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
